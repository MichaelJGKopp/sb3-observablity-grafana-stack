# app
spring.application.name=fraud-detection-service
server.port=8081

# datasource
spring.sql.init.mode=always
spring.datasource.url=jdbc:mysql://localhost:3316/fraud_detection
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# actuator endpoint exposure
management.endpoints.web.exposure.include=health, info, metrics, prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=fraud-detection-service
# by default only 10% of the traces are sampled
management.tracing.sampling.probability=1.0